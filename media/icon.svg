<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    
    <!-- Primary Cyan Plasma Gradient -->
    <linearGradient id="cyanPlasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Forge Fire & Amber Core Gradient -->
    <linearGradient id="forgeFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#5ab9fc"/>
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#softShadow)"/>
  
  <!-- Subtle Hexagonal Grid Line -->
  <polygon points="64,16 104,39 104,85 64,108 24,85 24,39" fill="none" stroke="rgba(56,189,248,0.12)" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Circuit Routing Traces -->
  <path d="M24,39 L44,51 L44,77 L24,89" fill="none" stroke="url(#traceGrad)" stroke-width="1.5" opacity="0.6"/>
  <path d="M104,39 L84,51 L84,77 L104,89" fill="none" stroke="url(#traceGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="64" y1="16" x2="64" y2="34" stroke="url(#traceGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="64" y1="94" x2="64" y2="108" stroke="url(#traceGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Trace Nodes -->
  <circle cx="44" cy="51" r="2.5" fill="#10b981"/>
  <circle cx="44" cy="77" r="2.5" fill="#38bdf8"/>
  <circle cx="84" cy="51" r="2.5" fill="#38bdf8"/>
  <circle cx="84" cy="77" r="2.5" fill="#10b981"/>

  <!-- Stylized Quantum Anvil & Forge Horn (ForgeCode Core) -->
  <!-- Top Anvil Face & Horn -->
  <path d="M36,46 L92,46 L84,56 L72,56 L72,66 L78,74 L84,74 L84,82 L44,82 L44,74 L50,74 L56,66 L56,56 L44,56 Z" fill="url(#cyanPlasma)" filter="url(#coreGlow)"/>

  <!-- Inner Forge Flame Core (Ascending Energy) -->
  <path d="M64,36 Q69,48 64,60 Q59,48 64,36 Z" fill="url(#forgeFlame)" filter="url(#coreGlow)"/>

  <!-- Center Quantum Pulse Diamond -->
  <polygon points="64,52 70,58 64,64 58,58" fill="#ffffff" opacity="0.95"/>
</svg>
